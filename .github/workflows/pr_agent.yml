name: PR Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

  issue_comment:
    types:
      - created

jobs:
  pr_agent_job:
    if: >-
      ${{ github.event.sender.type != 'Bot' &&
      (github.event_name == 'pull_request' ||
      github.event.issue.pull_request) }}

    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write

    steps:
      - name: Run PR Agent
        uses: the-pr-agent/pr-agent@main

        env:
          # GitHub 自动提供
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # 公司 LiteLLM 网关
          OPENAI__API_BASE: "http://litellm-poc.pgw.metax-tech.com/v1"

          # LiteLLM 网关密钥
          OPENAI__KEY: ${{ secrets.LITELLM_API_KEY }}

          # 指定内部部署模型
          config.model: "openai/MiniMax-M2.7-W8A8"
          config.fallback_models: '["openai/MiniMax-M2.7-W8A8"]'

          # 自定义模型必须指定上下文长度
          config.custom_model_max_tokens: "32000"

          # 输出中文
          config.response_language: "zh-CN"

          # 自动执行 review
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

          github_action_config.pr_actions: >-
            ["opened", "reopened", "ready_for_review", "synchronize"]
